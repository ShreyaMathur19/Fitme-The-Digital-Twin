<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBot - Your Fitness Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .sidebar {
            background: rgba(33, 33, 33, 0.9);
            height: 100vh;
            position: fixed;
            padding: 20px;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .nav-link {
            color: #ddd;
            margin: 10px 0;
            transition: all 0.3s;
        }
        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .chat-container {
            background: rgba(33, 33, 33, 0.9);
            border-radius: 15px;
            height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #444;
        }
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 20px;
            max-width: 80%;
        }
        .user-message {
            margin-left: auto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px;
            border-radius: 15px 15px 0 15px;
        }
        .bot-message {
            margin-right: auto;
            background: rgba(51, 51, 51, 0.8);
            padding: 15px;
            border-radius: 15px 15px 15px 0;
        }
        .chat-input {
            padding: 20px;
            border-top: 1px solid #444;
        }
        .chat-input form {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex-grow: 1;
            background: rgba(51, 51, 51, 0.8);
            border: 1px solid #444;
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
        }
        .chat-input input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(51, 51, 51, 0.9);
        }
        .chat-input button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .typing-indicator {
            display: none;
            margin-bottom: 20px;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ddd;
            border-radius: 50%;
            margin-right: 5px;
            animation: typing 1s infinite;
        }
        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h3 class="mb-4">FitMe</h3>
                <nav class="nav flex-column">
                    <a class="nav-link" href="{{ url_for('dashboard') }}">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a class="nav-link active" href="{{ url_for('chatbot') }}">
                        <i class="fas fa-robot"></i> Chatbot
                    </a>
                    <a class="nav-link" href="{{ url_for('calendar') }}">
                        <i class="fas fa-calendar"></i> Calendar
                    </a>
                    <a class="nav-link" href="{{ url_for('logout') }}">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <div class="chat-container">
                    <div class="chat-header">
                        <h4><i class="fas fa-robot me-2"></i>FitBot - Your Personal Fitness Assistant</h4>
                        <p class="mb-0">Ask me anything about fitness, nutrition, or your workout plan!</p>
                    </div>
                    
                    <div class="chat-messages" id="chatMessages">
                        <div class="message bot-message">
                            Hi {{ session.username }}! I'm your personal fitness assistant. How can I help you today?
                        </div>
                        <div class="typing-indicator" id="typingIndicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                    
                    <div class="chat-input">
                        <form id="chatForm" onsubmit="sendMessage(event)">
                            <input type="text" id="messageInput" placeholder="Type your message..." required>
                            <button type="submit">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function sendMessage(event) {
            event.preventDefault();
            const messageInput = document.getElementById('messageInput');
            const message = messageInput.value;
            messageInput.value = '';
            
            // Add user message to chat
            addMessage(message, 'user-message');
            
            // Show typing indicator
            document.getElementById('typingIndicator').style.display = 'block';
            
            // Send message to server
            fetch('/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                // Hide typing indicator
                document.getElementById('typingIndicator').style.display = 'none';
                // Add bot response to chat
                addMessage(data.response, 'bot-message');
            });
        }
        
        function addMessage(message, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = message;
            chatMessages.insertBefore(messageDiv, document.getElementById('typingIndicator'));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
