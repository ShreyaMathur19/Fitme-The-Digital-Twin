<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FitMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .sidebar {
            background: rgba(33, 33, 33, 0.9);
            height: 100vh;
            position: fixed;
            padding: 20px;
        }
        .main-content {
            margin-left: 250px;
            padding: 20px;
        }
        .nav-link {
            color: #ddd;
            margin: 10px 0;
            transition: all 0.3s;
        }
        .nav-link:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
        .card {
            background: rgba(33, 33, 33, 0.9);
            border: none;
            margin-bottom: 20px;
        }
        .progress-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .exercise-item, .meal-item {
            background: rgba(51, 51, 51, 0.5);
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .exercise-item:hover, .meal-item:hover {
            background: rgba(51, 51, 51, 0.8);
        }
        .completed {
            background: rgba(40, 167, 69, 0.3);
        }
        .form-check-input {
            margin-right: 10px;
        }
        #progressGraph {
            background: rgba(33, 33, 33, 0.9);
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <h3 class="mb-4">FitMe</h3>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="{{ url_for('dashboard') }}">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a class="nav-link" href="{{ url_for('chatbot') }}">
                        <i class="fas fa-robot"></i> Chatbot
                    </a>
                    <a class="nav-link" href="{{ url_for('calendar') }}">
                        <i class="fas fa-calendar"></i> Calendar
                    </a>
                    <a class="nav-link" href="{{ url_for('logout') }}">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </nav>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 main-content">
                <h2>Welcome, {{ session.username }}!</h2>
                
                <!-- Progress Graph -->
                <div class="card mb-4">
                    <div class="card-body">
                        <h4>Your Progress</h4>
                        <div id="progressGraph"></div>
                    </div>
                </div>

                <div class="row">
                    <!-- Exercise Recommendations -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h4>Today's Exercises</h4>
                                <div id="exerciseList"></div>
                                <button class="btn btn-primary mt-3" onclick="getExerciseRecommendations()">
                                    Get New Recommendations
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Meal Suggestions -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h4>Today's Meal Plan</h4>
                                <div id="mealList"></div>
                                <button class="btn btn-primary mt-3" onclick="getMealSuggestions()">
                                    Get New Meal Plan
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load initial data
        window.onload = function() {
            getExerciseRecommendations();
            getMealSuggestions();
            updateProgressGraph();
        };

        // Get exercise recommendations
        function getExerciseRecommendations() {
            fetch('/get_exercise_recommendations')
                .then(response => response.json())
                .then(exercises => {
                    const exerciseList = document.getElementById('exerciseList');
                    exerciseList.innerHTML = exercises.map((exercise, index) => `
                        <div class="exercise-item" id="exercise-${index}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       onchange="updateProgress(${exercise.id}, this.checked)">
                                <label class="form-check-label">
                                    <h5>${exercise.name}</h5>
                                    <p>Duration/Reps: ${exercise.duration}<br>
                                    Difficulty: ${exercise.difficulty}<br>
                                    Target: ${exercise.target}</p>
                                </label>
                            </div>
                        </div>
                    `).join('');
                });
        }

        // Get meal suggestions
        function getMealSuggestions() {
            fetch('/get_meal_suggestions')
                .then(response => response.json())
                .then(meals => {
                    const mealList = document.getElementById('mealList');
                    mealList.innerHTML = meals.map((meal, index) => `
                        <div class="meal-item" id="meal-${index}">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" 
                                       onchange="updateMeal(${meal.id}, this.checked)">
                                <label class="form-check-label">
                                    <h5>${meal.type}</h5>
                                    <p>${meal.description}<br>
                                    Calories: ${meal.calories}<br>
                                    Protein: ${meal.protein}g | Carbs: ${meal.carbs}g | Fat: ${meal.fat}g</p>
                                </label>
                            </div>
                        </div>
                    `).join('');
                });
        }

        // Update exercise progress
        function updateProgress(progressId, isCompleted) {
            fetch('/update_progress', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    progress_id: progressId,
                    is_completed: isCompleted
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    updateProgressGraph();
                    const exerciseItem = document.querySelector(`#exercise-${progressId}`);
                    if (isCompleted) {
                        exerciseItem.classList.add('completed');
                    } else {
                        exerciseItem.classList.remove('completed');
                    }
                }
            });
        }

        // Update meal progress
        function updateMeal(mealId, isCompleted) {
            fetch('/update_meal', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    meal_id: mealId,
                    is_completed: isCompleted
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const mealItem = document.querySelector(`#meal-${mealId}`);
                    if (isCompleted) {
                        mealItem.classList.add('completed');
                    } else {
                        mealItem.classList.remove('completed');
                    }
                }
            });
        }

        // Update progress graph
        function updateProgressGraph() {
            fetch('/get_progress_graph')
                .then(response => response.json())
                .then(graphJSON => {
                    Plotly.newPlot('progressGraph', JSON.parse(graphJSON));
                });
        }
    </script>
</body>
</html>
