<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitMe - Your Personal Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 20;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0 15px;
        }
        .registration-container {
            background: rgba(20, 20, 20, 0.9);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 0 20px rgba(126, 26, 26, 0.3);
            max-width: 500px;
            width: 80%;
            text-align: center;
            position: relative;
            z-index: 1;
            margin: 2rem auto;
        }
        .form-title {
            color: #fff;
            text-align: center;
            margin-bottom: 2rem;
            font-weight: 700;
        }
        .tracking-period {
            margin-top: 1rem;
        }
        .bmi-display {
            text-align: center;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            background: rgba(108, 30, 30, 0.1);
            border: 1px solid rgba(108, 30, 30, 0.3);
        }
        .bmi-value {
            font-size: 2rem;
            font-weight: bold;
            color: #6c1e1e;
        }
        .bmi-category {
            font-size: 1.1rem;
            color: #fff;
        }
        .plan-selection {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 10px;
            background: rgba(108, 30, 30, 0.1);
            border: 1px solid rgba(108, 30, 30, 0.3);
            text-align: left;
        }
        .calorie-info {
            text-align: center;
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 10px;
            background: rgba(108, 30, 30, 0.1);
            border: 1px solid rgba(108, 30, 30, 0.3);
        }
        .calorie-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #6c1e1e;
        }
        .form-control, .form-select {
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background: #2a2a2a;
            border-color: #6c1e1e;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(108, 30, 30, 0.25);
        }
        .form-select option {
            background: #2a2a2a;
            color: #fff;
        }
        .form-check-input:checked {
            background-color: #6c1e1e;
            border-color: #6c1e1e;
        }
        .btn-primary {
            background-color: #6c1e1e;
            border-color: #6c1e1e;
            width: 100%;
            padding: 0.8rem;
            font-weight: 600;
            margin-top: 1rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-primary:hover {
            background-color: #8b2626;
            border-color: #8b2626;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(126, 26, 26, 0.5);
        }
        .text-muted {
            color: rgba(255, 255, 255, 0.6) !important;
        }
        .form-label {
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .form-check-label {
            color: #fff;
        }
        .circle {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: rgba(108, 30, 30, 0.4);
            border-radius: 50%;
            animation: moveUp 5s infinite alternate ease-in-out;
            z-index: 0;
        }
        @keyframes moveUp {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }
    </style>
</head>
<body>
    <div class="circle" style="top: 10%; left: 20%;"></div>
    <div class="circle" style="top: 50%; left: 70%; width: 70px; height: 70px;"></div>
    <div class="circle" style="top: 80%; left: 40%; width: 30px; height: 30px;"></div>
    
    <div class="container">
        <div class="registration-container">
            <h2 class="form-title">Welcome to FitMe</h2>
            <form id="registrationForm" onsubmit="saveUserData(event)">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="weight" class="form-label">Weight (kg)</label>
                        <input type="number" class="form-control" id="weight" required onchange="calculateBMI()">
                    </div>
                    <div class="col-md-6">
                        <label for="height" class="form-label">Height (cm)</label>
                        <input type="number" class="form-control" id="height" required onchange="calculateBMI()">
                    </div>
                </div>

                <div class="bmi-display" id="bmiDisplay" style="display: none;">
                    <div class="bmi-value" id="bmiValue">0</div>
                    <div class="bmi-category" id="bmiCategory">-</div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" class="form-control" id="age" required>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label">Gender</label>
                        <select class="form-select" id="gender" required>
                            <option value="">Select gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="activityLevel" class="form-label">Activity Level</label>
                    <select class="form-select" id="activityLevel" required onchange="calculateCalories()">
                        <option value="">Select activity level</option>
                        <option value="1.2">Sedentary (little or no exercise)</option>
                        <option value="1.375">Lightly active (light exercise 1-3 days/week)</option>
                        <option value="1.55">Moderately active (moderate exercise 3-5 days/week)</option>
                        <option value="1.725">Very active (hard exercise 6-7 days/week)</option>
                        <option value="1.9">Extra active (very hard exercise & physical job)</option>
                    </select>
                </div>

                <div class="calorie-info" id="calorieInfo" style="display: none;">
                    <div>Maintenance Calories: <span class="calorie-value" id="maintenanceCalories">0</span> cal/day</div>
                    <div>Target Calories: <span class="calorie-value" id="targetCalories">0</span> cal/day</div>
                </div>

                <div class="plan-selection">
                    <div class="mb-3">
                        <label class="form-label">Choose Your Plan</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="planType" id="suggestedPlan" value="suggested" checked>
                            <label class="form-check-label" for="suggestedPlan">
                                Suggested plan based on my BMI
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="planType" id="manualPlan" value="manual">
                            <label class="form-check-label" for="manualPlan">
                                I'll choose my own goal
                            </label>
                        </div>
                    </div>

                    <div id="manualGoalSelection" style="display: none;">
                        <label for="goal" class="form-label">Select Your Goal</label>
                        <select class="form-select" id="goal">
                            <option value="weight-loss">Weight Loss</option>
                            <option value="muscle-gain">Muscle Gain</option>
                            <option value="maintenance">Maintenance</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="trackingPeriod" class="form-label">Tracking Period (months)</label>
                    <input type="number" class="form-control" id="trackingPeriod" min="1" max="12" required>
                </div>

                <button type="submit" class="btn btn-primary">Start My Fitness Journey</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            
            if (weight && height) {
                const bmi = weight / ((height/100) * (height/100));
                document.getElementById('bmiValue').textContent = bmi.toFixed(1);
                
                let category = '';
                if (bmi < 18.5) category = 'Underweight';
                else if (bmi < 25) category = 'Normal weight';
                else if (bmi < 30) category = 'Overweight';
                else category = 'Obese';
                
                document.getElementById('bmiCategory').textContent = category;
                document.getElementById('bmiDisplay').style.display = 'block';
                
                if (document.getElementById('suggestedPlan').checked) {
                    const goal = suggestGoalBasedOnBMI(bmi);
                    document.getElementById('goal').value = goal;
                }
                
                calculateCalories();
            }
        }

        function suggestGoalBasedOnBMI(bmi) {
            if (bmi < 18.5) return 'muscle-gain';
            else if (bmi > 25) return 'weight-loss';
            else return 'maintenance';
        }

        function calculateCalories() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const age = parseInt(document.getElementById('age').value);
            const gender = document.getElementById('gender').value;
            const activityLevel = parseFloat(document.getElementById('activityLevel').value);

            if (weight && height && age && gender && activityLevel) {
                // Mifflin-St Jeor Equation
                let bmr;
                if (gender === 'male') {
                    bmr = 10 * weight + 6.25 * height - 5 * age + 5;
                } else {
                    bmr = 10 * weight + 6.25 * height - 5 * age - 161;
                }

                const maintenanceCalories = Math.round(bmr * activityLevel);
                document.getElementById('maintenanceCalories').textContent = maintenanceCalories;

                // Calculate target calories based on goal
                let targetCalories = maintenanceCalories;
                const goal = document.getElementById('goal').value;
                
                if (goal === 'weight-loss') {
                    targetCalories -= 500;
                } else if (goal === 'muscle-gain') {
                    targetCalories += 300;
                }

                document.getElementById('targetCalories').textContent = targetCalories;
                document.getElementById('calorieInfo').style.display = 'block';
            }
        }

        // Toggle manual goal selection
        document.querySelectorAll('input[name="planType"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const manualSelection = document.getElementById('manualGoalSelection');
                manualSelection.style.display = this.value === 'manual' ? 'block' : 'none';
                if (this.value === 'suggested') {
                    const bmi = parseFloat(document.getElementById('bmiValue').textContent);
                    if (!isNaN(bmi)) {
                        const suggestedGoal = suggestGoalBasedOnBMI(bmi);
                        document.getElementById('goal').value = suggestedGoal;
                        calculateCalories();
                    }
                }
            });
        });

        // Form submission
        function saveUserData(event) {
            event.preventDefault();
            
            const userData = {
                name: document.getElementById('name').value,
                weight: parseFloat(document.getElementById('weight').value),
                height: parseFloat(document.getElementById('height').value),
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                activityLevel: parseFloat(document.getElementById('activityLevel').value),
                goal: document.getElementById('goal').value,
                trackingPeriod: parseInt(document.getElementById('trackingPeriod').value),
                maintenanceCalories: parseInt(document.getElementById('maintenanceCalories').textContent),
                targetCalories: parseInt(document.getElementById('targetCalories').textContent)
            };
            
            localStorage.setItem('userData', JSON.stringify(userData));
            window.location.href = 'dashboard.html';
        }

        // Initialize goal selection
        document.getElementById('goal').addEventListener('change', calculateCalories);
    </script>
</body>
</html>
