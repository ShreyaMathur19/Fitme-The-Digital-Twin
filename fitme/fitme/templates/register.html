<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FitMe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
        }
        .form-container {
            background: rgba(33, 33, 33, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
        .form-control, .form-select {
            background-color: #333;
            border: 1px solid #444;
            color: white;
            margin-bottom: 15px;
        }
        .form-control:focus, .form-select:focus {
            background-color: #444;
            border-color: #666;
            color: white;
            box-shadow: none;
        }
        .form-label {
            color: #ddd;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            width: 100%;
            padding: 12px;
            margin-top: 20px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        .plan-options {
            margin: 20px 0;
            padding: 15px;
            background: rgba(51, 51, 51, 0.5);
            border-radius: 10px;
        }
        .form-check-input {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">Welcome to FitMe</h2>
            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" required>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Weight (kg)</label>
                            <input type="number" step="0.1" class="form-control" name="weight" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Height (cm)</label>
                            <input type="number" class="form-control" name="height" required>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" class="form-control" name="age" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label">Gender</label>
                            <select class="form-select" name="gender" required>
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Activity Level</label>
                    <select class="form-select" name="activity_level" required>
                        <option value="">Select activity level</option>
                        <option value="sedentary">Sedentary (little or no exercise)</option>
                        <option value="light">Light (exercise 1-3 times/week)</option>
                        <option value="moderate">Moderate (exercise 3-5 times/week)</option>
                        <option value="active">Active (exercise 6-7 times/week)</option>
                        <option value="very_active">Very Active (hard exercise daily)</option>
                    </select>
                </div>
                <div class="plan-options">
                    <label class="form-label">Choose Your Plan</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="plan_type" value="bmi_based" checked>
                        <label class="form-check-label">Suggested plan based on my BMI</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="plan_type" value="custom">
                        <label class="form-check-label">I'll choose my own goal</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Tracking Period (months)</label>
                    <input type="number" class="form-control" name="tracking_period" min="1" max="12" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
            </form>
            <div class="text-center mt-3">
                <p>Already have an account? <a href="{{ url_for('login') }}" class="text-info">Login here</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
